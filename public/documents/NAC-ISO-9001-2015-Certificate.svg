  <text x="590" y="998" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777777">Naveen Auto Components QMS Registrar</text>
  
  <!-- Footer -->
  <text x="400" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">Certificate Registration No: NAC-ISO-9001-2015-QMS • Original Issue Date: 2017 • Validated &amp; Certified</text>
