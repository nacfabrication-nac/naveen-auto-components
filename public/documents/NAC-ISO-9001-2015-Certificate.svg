  <circle cx="200" cy="940" r="44" fill="none" stroke="#0b1e36" stroke-width="1.5"/>
  <text x="200" y="935" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0b1e36">QUALITY</text>
  <text x="200" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">ASSURED</text>
  
