  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0b1e36">NAVEEN AUTO COMPONENTS</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">(NAC)</text>
  
  <!-- Locations -->
  <text x="400" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Registered Office:</text>
  <text x="400" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">No-2C/5, SP-64, 3rd Main Road, Ambattur Industrial Estate, Chennai – 600058, Tamil Nadu, India</text>
  
  <text x="400" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">Manufacturing Units:</text>
  <text x="400" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Factory 1 (Chennai Unit): No-T93, SIDCO Women Industrial Park, Kattur, Thirumullaivoyal, Chennai – 600062</text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Factory 2 (Cuddalore Unit): No-94/2D, Cuddalore-Chidambaram Road (NH-32), Kotthattai Village, Chidambaram – 608501</text>
  
  <line x1="200" y1="515" x2="600" y2="515" stroke="#dddddd" stroke-width="1"/>
  
