<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <rect width="800" height="1100" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#0b1e36" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#f57c00" stroke-width="3"/>
  
  <!-- Header -->
