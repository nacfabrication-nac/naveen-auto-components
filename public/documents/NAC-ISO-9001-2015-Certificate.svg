  <line x1="150" y1="180" x2="650" y2="180" stroke="#0b1e36" stroke-width="2"/>
  
  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555555">This is to certify that the Quality Management System of</text>
  
