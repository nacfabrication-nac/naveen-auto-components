  <text x="400" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Ferrous &amp; Non-Ferrous Metal Fabrication, Industrial Storage Tanks (Water, Condensate, Flash),</text>
  <text x="400" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Steam Distribution Pipeline Ducts, Header Pipelines, PEB Structural Steel Fabrication,</text>
  <text x="400" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Rail &amp; Bus Coach Components, Air Blower Housings &amp; Material Handling Bins.</text>
  
  <!-- Standard Box -->
